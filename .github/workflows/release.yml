name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # PyPI Trusted Publishing (OIDC) — no stored token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dash (provides dash-generate-components for build:py)
        run: uv pip install --system "dash>=3"

      - name: Build JS bundle + Python classes
        run: |
          npm ci
          npm run build

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
